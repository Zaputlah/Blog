<button
  *ngIf="popupVisible"
  type="button"
  class="selection-speaker"
  [style.left.px]="popupLeft"
  [style.top.px]="popupTop"
  (pointerdown)="preserveSelection($event)"
  (click)="speakSelection()"
  [attr.aria-label]="isSpeaking ? 'Ulangi teks pilihan' : 'Bacakan teks pilihan'"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4V9Z" stroke-width="1.9" stroke-linejoin="round"></path>
    <path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a8.5 8.5 0 0 1 0 13" stroke-width="1.9" stroke-linecap="round"></path>
  </svg>
  <span>{{ isSpeaking ? 'Ulangi' : 'Dengarkan' }}</span>
</button>
